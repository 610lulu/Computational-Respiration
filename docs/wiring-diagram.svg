<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Computational Respiration ESP32 RGB LED wiring diagram</title>
  <desc id="desc">ESP32 DevKit V1 GPIO 25, 26 and 27 connect through 220 to 330 ohm resistors to the red, green and blue channels of a common cathode RGB LED module. The common cathode connects to ground.</desc>
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#253b59"/>
      <stop offset="1" stop-color="#17263c"/>
    </linearGradient>
    <linearGradient id="module" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263746"/>
      <stop offset="1" stop-color="#17232f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#07101d" flood-opacity=".35"/>
    </filter>
    <style>
      .title { font: 700 32px 'Segoe UI', Arial, sans-serif; fill: #edf4ff; letter-spacing: 1px; }
      .subtitle { font: 400 17px 'Segoe UI', Arial, sans-serif; fill: #9fb2ca; }
      .component { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #f3f7ff; }
      .label { font: 600 17px 'Segoe UI', Arial, sans-serif; fill: #dbe8f7; }
      .small { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #a9bbd1; }
      .pin { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #142033; }
      .note { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffd78b; }
      .wire { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #6f829a; stroke-width: 2; stroke-dasharray: 7 8; }
    </style>
  </defs>

  <rect width="1400" height="820" fill="#0e1724"/>
  <text x="70" y="68" class="title">COMPUTATIONAL RESPIRATION</text>
  <text x="70" y="101" class="subtitle">ESP32 DevKit V1 → RGB LED module · common cathode baseline</text>

  <!-- ESP32 board -->
  <g filter="url(#shadow)">
    <rect x="90" y="170" width="430" height="490" rx="24" fill="url(#board)" stroke="#527092" stroke-width="3"/>
    <rect x="126" y="205" width="358" height="62" rx="11" fill="#152237" stroke="#395572" stroke-width="2"/>
    <text x="305" y="233" text-anchor="middle" class="component">ESP32 DevKit V1</text>
    <text x="305" y="255" text-anchor="middle" class="small">ESP32-WROOM-32 · 30 pin</text>
    <!-- USB -->
    <rect x="253" y="644" width="105" height="38" rx="7" fill="#b9c5d3"/>
    <rect x="275" y="653" width="61" height="20" rx="3" fill="#27364b"/>
    <text x="305" y="715" text-anchor="middle" class="small">USB power / upload</text>
    <!-- GPIO pins -->
    <rect x="486" y="310" width="34" height="42" rx="4" fill="#f15b5b"/>
    <rect x="486" y="390" width="34" height="42" rx="4" fill="#55d58b"/>
    <rect x="486" y="470" width="34" height="42" rx="4" fill="#63a6ff"/>
    <rect x="486" y="550" width="34" height="42" rx="4" fill="#d3dbe5"/>
    <text x="463" y="337" text-anchor="end" class="label">GPIO 25</text>
    <text x="463" y="417" text-anchor="end" class="label">GPIO 26</text>
    <text x="463" y="497" text-anchor="end" class="label">GPIO 27</text>
    <text x="463" y="577" text-anchor="end" class="label">GND</text>
    <text x="305" y="310" text-anchor="middle" class="small">PWM outputs used by firmware</text>
  </g>

  <!-- Resistors -->
  <g filter="url(#shadow)">
    <rect x="650" y="303" width="170" height="56" rx="12" fill="#4c3d2a" stroke="#a7834d" stroke-width="2"/>
    <rect x="650" y="383" width="170" height="56" rx="12" fill="#4c3d2a" stroke="#a7834d" stroke-width="2"/>
    <rect x="650" y="463" width="170" height="56" rx="12" fill="#4c3d2a" stroke="#a7834d" stroke-width="2"/>
    <text x="735" y="327" text-anchor="middle" class="label">220–330 Ω</text>
    <text x="735" y="349" text-anchor="middle" class="small">R channel</text>
    <text x="735" y="407" text-anchor="middle" class="label">220–330 Ω</text>
    <text x="735" y="429" text-anchor="middle" class="small">G channel</text>
    <text x="735" y="487" text-anchor="middle" class="label">220–330 Ω</text>
    <text x="735" y="509" text-anchor="middle" class="small">B channel</text>
  </g>

  <!-- RGB module -->
  <g filter="url(#shadow)">
    <rect x="1000" y="225" width="300" height="380" rx="24" fill="url(#module)" stroke="#6b8298" stroke-width="3"/>
    <text x="1150" y="275" text-anchor="middle" class="component">RGB LED MODULE</text>
    <text x="1150" y="302" text-anchor="middle" class="small">4-pin · common cathode</text>
    <circle cx="1150" cy="390" r="70" fill="#e7edf7" fill-opacity=".12" stroke="#f2f7ff" stroke-width="4"/>
    <circle cx="1125" cy="375" r="15" fill="#ff4e4e"/>
    <circle cx="1150" cy="413" r="15" fill="#42d98a"/>
    <circle cx="1175" cy="375" r="15" fill="#5da6ff"/>
    <text x="1150" y="510" text-anchor="middle" class="label">Use a module with onboard resistors</text>
    <text x="1150" y="537" text-anchor="middle" class="small">Common cathode → GND</text>
    <!-- pins -->
    <circle cx="1000" cy="330" r="11" fill="#f15b5b"/>
    <circle cx="1000" cy="410" r="11" fill="#55d58b"/>
    <circle cx="1000" cy="490" r="11" fill="#63a6ff"/>
    <circle cx="1000" cy="570" r="11" fill="#d3dbe5"/>
    <text x="1030" y="336" class="label">R</text>
    <text x="1030" y="416" class="label">G</text>
    <text x="1030" y="496" class="label">B</text>
    <text x="1030" y="576" class="label">COM / cathode</text>
  </g>

  <!-- Wires -->
  <path d="M520 331 H650" class="wire" stroke="#f15b5b"/>
  <path d="M820 331 H900 V330 H1000" class="wire" stroke="#f15b5b"/>
  <path d="M520 411 H650" class="wire" stroke="#55d58b"/>
  <path d="M820 411 H920 V410 H1000" class="wire" stroke="#55d58b"/>
  <path d="M520 491 H650" class="wire" stroke="#63a6ff"/>
  <path d="M820 491 H940 V490 H1000" class="wire" stroke="#63a6ff"/>
  <path d="M520 571 H590 V650 H950 V570 H1000" class="wire" stroke="#d3dbe5"/>
  <text x="570" y="303" text-anchor="middle" class="small">R</text>
  <text x="570" y="383" text-anchor="middle" class="small">G</text>
  <text x="570" y="463" text-anchor="middle" class="small">B</text>

  <!-- Legend / notes -->
  <line x1="70" y1="755" x2="1330" y2="755" class="thin"/>
  <text x="70" y="790" class="note">POWER OFF before changing wiring.</text>
  <text x="420" y="790" class="small">Common cathode: COM → GND.</text>
  <text x="700" y="790" class="small">Common anode: COM → 3V3 and set COMMON_ANODE = true.</text>
  <text x="70" y="138" class="small">Three PWM channels carry colour; the common pin is the return path.</text>
</svg>

